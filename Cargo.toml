[package]
name = "agentcli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "5"
async-trait = "0.1"
termimad = "0.35.2"
indicatif = "0.18.6"
console = "0.16.4"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ansi-to-tui = "8.0.1"
